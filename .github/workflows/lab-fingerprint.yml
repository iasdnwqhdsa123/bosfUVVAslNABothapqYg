name: Lab fingerprint
on:
  push:
    branches: [main]
    paths:
      - "calib/**"
      - "pipeline/**"
      - "!calib/*.request"
      - "calib/sweep.request"
      - "!calib/paused"
      - "!calib/lab.paused"
  workflow_dispatch:
    inputs:
      then:
        description: "After the stamps: resume the sweep, or nothing more"
        type: choice
        options: [nothing, resume]
        default: nothing
      sweep:
        description: "The sweep to resume (its start time, YYYYMMDDTHHMMSSZ; empty: the newest)"
        type: string
        default: ""
      on_change:
        description: "A code push in the middle, for the sweep resumed"
        type: choice
        options: [as started, finish, restart]
        default: as started
permissions:
  contents: read
  actions: write
concurrency:
  group: lab
  cancel-in-progress: false
env:
  CONTRAILS: "0"
  RECHECK_PARTS: "6"
  WAIT_S: "600"
  WAIT_FOR_S: "1800"
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      need: ${{ steps.need.outputs.need }}
      what: ${{ steps.request.outputs.what }}
      sweep: ${{ steps.request.outputs.sweep }}
      on_change: ${{ steps.request.outputs.on_change }}
      parts: ${{ steps.parts.outputs.parts }}
      n: ${{ steps.parts.outputs.n }}
      defer: ${{ steps.parts.outputs.defer }}
    env:
      CALIB_DATA_KEY: ${{ secrets.CALIB_DATA_KEY }}
      LAKE_S3_ENDPOINT: ${{ secrets.LAKE_S3_ENDPOINT }}
      LAKE_S3_BUCKET: ${{ secrets.LAKE_S3_BUCKET }}
      LAKE_S3_KEY: ${{ secrets.LAKE_S3_KEY }}
      LAKE_S3_SECRET: ${{ secrets.LAKE_S3_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: calib
      - id: check
        run: python3 calib/labjobs.py check
      - uses: actions/checkout@v7
        if: steps.check.outputs.ready == 'yes'
      - id: request
        if: steps.check.outputs.ready == 'yes'
        env:
          BEFORE: ${{ github.event.before }}
          THEN: ${{ inputs.then }}
          IN_SWEEP: ${{ inputs.sweep }}
          IN_ON_CHANGE: ${{ inputs.on_change }}
        run: |
          changed=no
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -f calib/sweep.request ] && [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] \
             && git fetch -q --depth=1 origin "$BEFORE" 2> /dev/null \
             && git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qx calib/sweep.request; then
            changed=yes
          fi
          if [ "$changed" = yes ]; then
            python3 calib/labjobs.py request --file calib/sweep.request
          elif [ "$THEN" = resume ]; then
            [[ -z "$IN_SWEEP" || "$IN_SWEEP" =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || { echo "::error::a sweep is its start time (YYYYMMDDTHHMMSSZ)"; exit 1; }
            oc=""
            case "$IN_ON_CHANGE" in finish|restart) oc="$IN_ON_CHANGE";; esac
            { echo "what=then"; echo "sweep=$IN_SWEEP"; echo "on_change=$oc"; } >> "$GITHUB_OUTPUT"; echo "request: resume, sweep ${IN_SWEEP:-the newest}"
          else
            { echo "what=none"; echo "sweep="; echo "on_change="; } >> "$GITHUB_OUTPUT"; echo "request: none"
          fi
      - uses: actions/setup-python@v7
        if: steps.check.outputs.ready == 'yes'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            calib/requirements.txt
            pipeline/requirements.txt
      - if: steps.check.outputs.ready == 'yes'
        run: pip install -q -r calib/requirements.txt -r pipeline/requirements.txt
      - id: need
        if: steps.check.outputs.ready == 'yes'
        run: python3 calib/labjobs.py need
      - id: parts
        if: steps.check.outputs.ready == 'yes' && steps.need.outputs.need == 'yes'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          n=0
          t0="$(date +%s)"
          while :; do
            env -u GITHUB_OUTPUT python3 calib/labjobs.py parts --most "$RECHECK_PARTS" > /tmp/parts.out
            grep '^lab:' /tmp/parts.out || true
            k="$(sed -n 's/^n=//p' /tmp/parts.out)"
            [ "${k:-0}" -gt 0 ] && break
            [ $(($(date +%s) - t0 + WAIT_S)) -ge "$WAIT_FOR_S" ] && break
            n=$((n + 1)); echo "no room beside the forecast: asking again in $((WAIT_S / 60)) min ($n)"
            sleep "$WAIT_S"
          done
          grep '^\(parts\|n\)=' /tmp/parts.out >> "$GITHUB_OUTPUT"
          if [ "${k:-0}" -gt 0 ]; then echo "defer=no" >> "$GITHUB_OUTPUT"; else echo "defer=yes" >> "$GITHUB_OUTPUT"; echo "still no room: handed on"; fi
  stamps:
    needs: gate
    if: needs.gate.outputs.ready == 'yes' && needs.gate.outputs.need == 'yes' && needs.gate.outputs.defer == 'no'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CALIB_DATA_KEY: ${{ secrets.CALIB_DATA_KEY }}
      LAKE_S3_ENDPOINT: ${{ secrets.LAKE_S3_ENDPOINT }}
      LAKE_S3_BUCKET: ${{ secrets.LAKE_S3_BUCKET }}
      LAKE_S3_KEY: ${{ secrets.LAKE_S3_KEY }}
      LAKE_S3_SECRET: ${{ secrets.LAKE_S3_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            calib/requirements.txt
            pipeline/requirements.txt
      - run: pip install -q -r calib/requirements.txt -r pipeline/requirements.txt
      - name: The stamps
        run: |
          python3 calib/labjobs.py kept --out /tmp/kept
          cur=()
          [ -f /tmp/kept/current.json ] && cur=(--current /tmp/kept/current.json)
          mkdir -p /tmp/logs
          python3 calib/fingerprint.py groups --kept /tmp/kept/gvref.npz "${cur[@]}" --out /tmp/gv --work /tmp/gvwork 2>> /tmp/logs/stderr.log \
            || { echo "::error::the reference boxes failed"; exit 1; }
          [ -f /tmp/gv/gv.json ] || { echo "::error::a reference box failed: no stamps"; exit 1; }
          python3 calib/state.py pack /tmp/gv /tmp/lab-gv.enc
      - uses: actions/upload-artifact@v7
        with:
          name: lab-gv
          path: /tmp/lab-gv.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Pack the log
        if: always()
        run: |
          [ -s /tmp/logs/stderr.log ] || { echo "no log"; exit 0; }
          mkdir -p /tmp/out
          python3 calib/state.py encrypt /tmp/logs/stderr.log /tmp/out/lab-log.enc
          echo "the job's log, encrypted"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lab-log-stamps-${{ github.run_attempt }}
          path: /tmp/out/lab-log.enc
          retention-days: 3
          compression-level: 0
          if-no-files-found: ignore
  recheck:
    needs: [gate, stamps]
    if: needs.gate.outputs.ready == 'yes' && needs.gate.outputs.need == 'yes' && needs.gate.outputs.defer == 'no'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.gate.outputs.parts) }}
    env:
      CALIB_DATA_KEY: ${{ secrets.CALIB_DATA_KEY }}
      LAKE_S3_ENDPOINT: ${{ secrets.LAKE_S3_ENDPOINT }}
      LAKE_S3_BUCKET: ${{ secrets.LAKE_S3_BUCKET }}
      LAKE_S3_KEY: ${{ secrets.LAKE_S3_KEY }}
      LAKE_S3_SECRET: ${{ secrets.LAKE_S3_SECRET }}
      PART: ${{ matrix.part }}
      N_PARTS: ${{ needs.gate.outputs.n }}
    steps:
      - id: start
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            calib/requirements.txt
            pipeline/requirements.txt
      - run: pip install -q -r calib/requirements.txt -r pipeline/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: lab-gv
          path: /tmp/in
      - name: Recheck
        env:
          STARTED: ${{ steps.start.outputs.started }}
        run: |
          python3 calib/state.py unpack /tmp/in/lab-gv.enc /tmp/gv
          mkdir -p /tmp/rc /tmp/logs
          python3 calib/labjobs.py recheck --gv /tmp/gv/gv.json --part "$PART/$N_PARTS" --out "/tmp/rc/part-$PART.json" \
            --work /tmp/work --started "$STARTED" 2>> /tmp/logs/stderr.log || { echo "::error::the recheck stopped"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: lab-recheck-${{ matrix.part }}
          path: /tmp/rc/part-${{ matrix.part }}.json
          retention-days: 1
          if-no-files-found: error
      - name: Pack the log
        if: always()
        run: |
          [ -s /tmp/logs/stderr.log ] || { echo "no log"; exit 0; }
          mkdir -p /tmp/out
          python3 calib/state.py encrypt /tmp/logs/stderr.log /tmp/out/lab-log.enc
          echo "the job's log, encrypted"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lab-log-recheck-${{ matrix.part }}-${{ github.run_attempt }}
          path: /tmp/out/lab-log.enc
          retention-days: 3
          compression-level: 0
          if-no-files-found: ignore
  write:
    needs: [gate, stamps, recheck]
    if: needs.gate.outputs.ready == 'yes' && needs.gate.outputs.need == 'yes' && needs.gate.outputs.defer == 'no'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CALIB_DATA_KEY: ${{ secrets.CALIB_DATA_KEY }}
      LAKE_S3_ENDPOINT: ${{ secrets.LAKE_S3_ENDPOINT }}
      LAKE_S3_BUCKET: ${{ secrets.LAKE_S3_BUCKET }}
      LAKE_S3_KEY: ${{ secrets.LAKE_S3_KEY }}
      LAKE_S3_SECRET: ${{ secrets.LAKE_S3_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            calib/requirements.txt
            pipeline/requirements.txt
      - run: pip install -q -r calib/requirements.txt -r pipeline/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/in
          pattern: lab-[gr][ve]*
      - name: Write the stamps
        env:
          N_PARTS: ${{ needs.gate.outputs.n }}
        run: |
          python3 calib/state.py unpack /tmp/in/lab-gv/lab-gv.enc /tmp/gv
          mkdir -p /tmp/rc
          cp /tmp/in/lab-recheck-*/part-*.json /tmp/rc/ 2> /dev/null || true
          python3 calib/labjobs.py write --gv /tmp/gv --rechecks /tmp/rc --parts "$N_PARTS"
  relay:
    needs: [gate, write]
    if: ${{ always() && !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.ready == 'yes' && needs.gate.outputs.defer != 'yes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CALIB_DATA_KEY: ${{ secrets.CALIB_DATA_KEY }}
      LAKE_S3_ENDPOINT: ${{ secrets.LAKE_S3_ENDPOINT }}
      LAKE_S3_BUCKET: ${{ secrets.LAKE_S3_BUCKET }}
      LAKE_S3_KEY: ${{ secrets.LAKE_S3_KEY }}
      LAKE_S3_SECRET: ${{ secrets.LAKE_S3_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            calib/requirements.txt
            pipeline/requirements.txt
      - run: pip install -q -r calib/requirements.txt -r pipeline/requirements.txt
      - id: relay
        env:
          WHAT: ${{ needs.gate.outputs.what }}
          SWEEP: ${{ needs.gate.outputs.sweep }}
          ON_CHANGE: ${{ needs.gate.outputs.on_change }}
        run: |
          args=(--request calib/sweep.request)
          case "$WHAT" in
            start) args+=(--what start --sweep "$SWEEP");;
            resume|pause) args+=(--what "$WHAT");;
            then) args+=(--then resume); [ -n "$SWEEP" ] && args+=(--sweep "$SWEEP");;
          esac
          case "$ON_CHANGE" in finish|restart) args+=(--on-change "$ON_CHANGE");; esac
          python3 calib/labjobs.py relay "${args[@]}"
      - name: Dispatch
        if: steps.relay.outputs.dispatch == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          SWEEP: ${{ steps.relay.outputs.sweep }}
          WAVE: ${{ steps.relay.outputs.wave }}
          ON_CHANGE: ${{ steps.relay.outputs.on_change }}
        run: |
          ids="$(for s in pending queued waiting requested; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$s&per_page=50" \
              --jq '.workflow_runs[] | select(.path == ".github/workflows/lab-build.yml" or .path == ".github/workflows/lab-fingerprint.yml") | .id'
          done | sort -u)"
          n=0
          for id in $ids; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            st="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .status)"
            case "$st" in pending|queued|waiting|requested) n=$((n + 1));; esac
          done
          if [ "$n" -gt 0 ]; then echo "a lab run waits already: it goes first"; exit 0; fi
          oc=()
          case "$ON_CHANGE" in finish|restart) oc=(-f on_change="$ON_CHANGE");; esac
          gh workflow run lab-build.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f sweep="$SWEEP" -f wave="$WAVE" "${oc[@]}"
          echo "lab-build asked for: sweep $SWEEP, wave $WAVE"
  again:
    needs: gate
    if: needs.gate.outputs.ready == 'yes' && needs.gate.outputs.defer == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Hand on
        env:
          GH_TOKEN: ${{ github.token }}
          WHAT: ${{ needs.gate.outputs.what }}
          SWEEP: ${{ needs.gate.outputs.sweep }}
          ON_CHANGE: ${{ needs.gate.outputs.on_change }}
        run: |
          ids="$(for s in pending queued waiting requested; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$s&per_page=50" \
              --jq '.workflow_runs[] | select(.path == ".github/workflows/lab-build.yml" or .path == ".github/workflows/lab-fingerprint.yml") | .id'
          done | sort -u)"
          n=0
          for id in $ids; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            st="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .status)"
            case "$st" in pending|queued|waiting|requested) n=$((n + 1));; esac
          done
          if [ "$n" -gt 0 ]; then echo "a lab run waits already: it goes first"; exit 0; fi
          args=(-f then=nothing)
          case "$WHAT" in start|resume|then) args=(-f then=resume);; esac
          [[ "$SWEEP" =~ ^[0-9]{8}T[0-9]{6}Z$ ]] && args+=(-f sweep="$SWEEP")
          case "$ON_CHANGE" in finish|restart) args+=(-f on_change="$ON_CHANGE");; esac
          gh workflow run lab-fingerprint.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" "${args[@]}"
          echo "lab-fingerprint asked for again"
