name: Lab backfill
on:
  push:
    branches: [main]
    paths: ["calib/lab-backfill.request"]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: lab-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LAKE_S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      LAKE_S3_BUCKET: ${{ secrets.LAKE_S3_BUCKET || 'lake' }}
      LAKE_S3_KEY: ${{ secrets.LAKE_S3_KEY }}
      LAKE_S3_SECRET: ${{ secrets.LAKE_S3_SECRET }}
      WEGLIDE_ON: "0"
    steps:
      - name: Set up?
        id: on
        run: |
          if [ -n "$LAKE_S3_ENDPOINT" ] && [ -n "$LAKE_S3_BUCKET" ] && [ -n "$LAKE_S3_KEY" ] && [ -n "$LAKE_S3_SECRET" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "lab backfill: the lake's secrets (LAKE_S3_*) are not set: nothing done"; fi
      - uses: actions/checkout@v7
        if: steps.on.outputs.go == 'true'
      - uses: actions/setup-python@v7
        if: steps.on.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: calib/requirements.txt
      - name: Python packages
        if: steps.on.outputs.go == 'true'
        run: for i in 1 2 3; do pip install -q -r calib/requirements.txt -r pipeline/requirements.txt && break; [ "$i" = 3 ] && exit 1; sleep 30; done
      - name: Backfill
        if: steps.on.outputs.go == 'true'
        run: python3 calib/labingest.py run --what iem --days hindcast --minutes 330 --status "$RUNNER_TEMP/backfill.json"
      - name: The next run
        if: steps.on.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(jq -r '.more' "$RUNNER_TEMP/backfill.json" 2>/dev/null)" = true ]; then
            for i in 1 2 3 4 5; do gh workflow run lab-backfill.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" && break; [ "$i" = 5 ] && exit 1; sleep $((30 << (i - 1))); done
            echo "days left: the next run asked for"
          else
            echo "the backfill is done (or stopped short of time: the next request goes on)"
          fi
