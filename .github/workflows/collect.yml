name: Collect
on:
  push:
    branches: [main]
    paths: ["calib/collect.request"]
  schedule:
    - cron: "17 0 * * *"
    - cron: "42 4 * * *"
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days this run"
        type: choice
        options: ["36", "1", "3", "5", "8", "20", "60"]
        default: "36"
      new_days:
        description: "New days from the flight archive (off: seed days only)"
        type: choice
        options: ["on", "off"]
        default: "on"
      chain:
        description: "Chain the next run while work is left (off: this run only)"
        type: choice
        options: ["on", "off"]
        default: "on"
      after_failure:
        description: "Asked for by a run that failed (relay; if this one fails too, the chain waits for the next cron)"
        type: choice
        options: ["no", "yes"]
        default: "no"
permissions:
  contents: read
  actions: write
concurrency:
  group: calib
  cancel-in-progress: false
env:
  DAYS_PER_RUN: "36"
  MAX_REQUESTS: "300"
  DAILY_REQUESTS: "3000"
  MINUTES: "20"
  BUILD_MINUTES: "40"
  SHARDS: "6"
  CALIB_GRID_FIELDS: "eval"
  CALIB_GRID_HOURS: "8-20"
  KEEP_DAYS: "60"
  CALIB_EU_SHARE: "0.4"
  CALIB_EU_FIRST: "120"
  CALIB_EU_ICON_SHARE: "1"
  CONTRAILS: "0"
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
      stale: ${{ steps.stale.outputs.stale }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: calib
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: g
        run: |
          if [ -f calib/paused ]; then echo "paused"; echo "run=no" >> "$GITHUB_OUTPUT"; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Grid bundles to keep
        id: stale
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          stale="$(python3 calib/state.py list calib-grids- --older "$KEEP_DAYS" | python3 -c 'import json,sys; print(json.dumps(sorted(k[len("calib-grids-"):] for k in json.load(sys.stdin))))')" || stale="[]"
          echo "bundles to upload again: $stale"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
      - name: Keep the data while paused
        id: keep
        if: steps.g.outputs.run == 'no'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          age="$(python3 calib/state.py age calib-data)"
          echo "newest data: $age days old"
          if [ "$age" != none ] && [ "${age%.*}" -ge 30 ]; then python3 calib/state.py raw calib-data /tmp/keep && echo "again=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v7
        if: steps.keep.outputs.again == 'yes'
        with:
          name: calib-data
          path: /tmp/keep/calib-data.enc
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Keep the schedule on
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.workflow_ref }}
        run: |
          self="${SELF#*/.github/workflows/}"; self="${self%%@*}"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$self/enable" && echo "kept on"
  keep_grids:
    needs: gate
    if: needs.gate.outputs.run == 'no' && needs.gate.outputs.stale != '' && needs.gate.outputs.stale != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        month: ${{ fromJSON(needs.gate.outputs.stale) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: calib
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch it as it is
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONTH: ${{ matrix.month }}
        run: python3 calib/state.py raw "calib-grids-$MONTH" /tmp/keep
      - uses: actions/upload-artifact@v7
        with:
          name: calib-grids-${{ matrix.month }}
          path: /tmp/keep/calib-grids-${{ matrix.month }}.enc
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
  plan:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CALIB_DATA_KEY: ${{ secrets.CALIB_DATA_KEY }}
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      base: ${{ steps.restore.outputs.base }}
      days: ${{ steps.opts.outputs.days }}
      new: ${{ steps.opts.outputs.new }}
      chain: ${{ steps.opts.outputs.chain }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            calib/requirements.txt
            pipeline/requirements.txt
      - run: pip install -q -r calib/requirements.txt -r pipeline/requirements.txt
      - name: Check the key
        run: |
          [ -n "$CALIB_DATA_KEY" ] || { echo "::error::CALIB_DATA_KEY not set"; exit 1; }
      - name: Options
        id: opts
        env:
          IN_DAYS: ${{ inputs.days }}
          IN_NEW: ${{ inputs.new_days }}
          IN_CHAIN: ${{ inputs.chain }}
        run: |
          days="${IN_DAYS:-$DAYS_PER_RUN}"; new="${IN_NEW:-on}"; chain="${IN_CHAIN:-on}"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -f calib/collect.request ]; then
            days="$(python3 -c 'import json; print(int(json.load(open("calib/collect.request")).get("days", 36)))' 2>/dev/null || echo "$DAYS_PER_RUN")"
            chain="$(python3 -c 'import json; print(json.load(open("calib/collect.request")).get("chain", "on"))' 2>/dev/null || echo on)"
          fi
          case "$days" in 1|3|5|8|20|36|60) ;; *) days="$DAYS_PER_RUN";; esac
          case "$new" in on|off) ;; *) new=on;; esac
          case "$chain" in on|off) ;; *) chain=on;; esac
          echo "days $days, new days $new, chain $chain"
          { echo "days=$days"; echo "new=$new"; echo "chain=$chain"; } >> "$GITHUB_OUTPUT"
      - name: Restore the data
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/data
          set +e
          python3 calib/state.py fetch calib-data /tmp/data --id /tmp/base 2>> /tmp/fetch.err
          rc=$?
          set -e
          if [ "$rc" = 3 ]; then echo "no data yet: starting from the seed"
          elif [ "$rc" != 0 ]; then tail -n 2 /tmp/fetch.err; echo "::error::couldn't fetch the data (exit $rc)"; exit 1; fi
          echo "base=$(cat /tmp/base)" >> "$GITHUB_OUTPUT"
          python3 calib/state.py decrypt calib/seed.enc /tmp/seed.json.gz
      - name: Fingerprint
        continue-on-error: true
        run: |
          mkdir -p /tmp/plan
          python3 calib/fingerprint.py ensure --table /tmp/data/fingerprints.json --out /tmp/plan/fingerprints.json --work /tmp/fpwork \
            2>> /tmp/fp.err || { echo "::warning::no fingerprint for this code (its stamp matches only itself)"; echo '{}' > /tmp/plan/fingerprints.json; }
      - name: Corrections
        id: corr
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if python3 calib/state.py fetch calib-model /tmp/model 2> /dev/null && [ -f /tmp/model/corrections.json ]; then
            echo "corrections found"; echo "file=/tmp/model/corrections.json" >> "$GITHUB_OUTPUT"
          else
            echo "no corrections yet"
          fi
      - name: Plan
        id: plan
        env:
          DAYS: ${{ steps.opts.outputs.days }}
          NEW: ${{ steps.opts.outputs.new }}
          CORR: ${{ steps.corr.outputs.file }}
          CALIB_FINGERPRINTS: /tmp/data/fingerprints.json:/tmp/plan/fingerprints.json
        run: |
          mkdir -p /tmp/plan/logs
          extra=""
          [ "$NEW" = off ] && extra="--no-new"
          [ -n "$CORR" ] && [ -f "$CORR" ] && extra="$extra --corrections $CORR"
          python3 calib/batch.py plan --data /tmp/data --seed /tmp/seed.json.gz --out /tmp/plan --days "$DAYS" --requests "$MAX_REQUESTS" \
            --daily "$DAILY_REQUESTS" --minutes "$MINUTES" --shards "$SHARDS" $extra 2>> "/tmp/plan/logs/stderr-$GITHUB_RUN_ID-plan.log" \
            || { echo "::error::plan failed (details in the encrypted log)"; exit 1; }
      - name: Pack
        run: |
          mkdir -p /tmp/out
          python3 calib/state.py pack /tmp/plan /tmp/out/calib-plan.enc
          ls -la /tmp/out
      - uses: actions/upload-artifact@v7
        with:
          name: calib-plan
          path: /tmp/out/calib-plan.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  build:
    needs: plan
    if: needs.plan.outputs.shards != '' && needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      CALIB_DATA_KEY: ${{ secrets.CALIB_DATA_KEY }}
      WORKERS: "4"
      SHARD: ${{ matrix.shard }}
      CALIB_FINGERPRINTS: /tmp/plan/fingerprints.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install -q -r pipeline/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: calib-plan
          path: /tmp/in
      - name: Unpack the plan
        id: unpack
        run: python3 calib/state.py unpack /tmp/in/calib-plan.enc /tmp/plan
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/built/logs
          python3 calib/batch.py build --plan /tmp/plan --shard "$SHARD" --out /tmp/built --work /tmp/work --grids /tmp/grids --minutes "$BUILD_MINUTES" \
            2>> "/tmp/built/logs/stderr-$GITHUB_RUN_ID-build$SHARD.log" || { echo "::error::build failed (details in the encrypted log)"; exit 1; }
      - name: Pack
        if: always() && steps.unpack.outcome == 'success'
        run: |
          rm -rf /tmp/work /tmp/grids
          mkdir -p /tmp/out
          du -sh /tmp/built/grids 2> /dev/null || true
          python3 calib/state.py pack /tmp/built /tmp/out/calib-built.enc
          ls -la /tmp/out
      - uses: actions/upload-artifact@v7
        if: always() && steps.unpack.outcome == 'success'
        with:
          name: calib-built-${{ matrix.shard }}
          path: /tmp/out/calib-built.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  merge:
    needs: [gate, plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CALIB_DATA_KEY: ${{ secrets.CALIB_DATA_KEY }}
    outputs:
      months: ${{ steps.merge.outputs.months }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /calib/
            /pipeline/*.py
            /pipeline/native/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: calib/requirements.txt
      - run: pip install -q -r calib/requirements.txt
      - name: Restore the data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          mkdir -p /tmp/data
          set +e
          python3 calib/state.py fetch calib-data /tmp/data --id /tmp/base 2>> /tmp/fetch.err
          rc=$?
          set -e
          if [ "$rc" != 0 ] && [ "$rc" != 3 ]; then tail -n 2 /tmp/fetch.err; echo "::error::couldn't fetch the data (exit $rc)"; exit 1; fi
          [ "$(cat /tmp/base)" = "$BASE" ] || { echo "::error::the data changed since the plan: not merged"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: calib-plan
          path: /tmp/in
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: calib-built-*
          path: /tmp/in/built
      - name: Unpack
        run: |
          python3 calib/state.py unpack /tmp/in/calib-plan.enc /tmp/plan
          mkdir -p /tmp/built
          for f in /tmp/in/built/*/calib-built.enc; do
            [ -f "$f" ] || continue
            d="$(basename "$(dirname "$f")")"
            python3 calib/state.py unpack "$f" "/tmp/built/$d" || echo "::warning::a shard's days couldn't be read"
          done
          echo "$(ls /tmp/built | wc -l) shards back"
      - name: Merge
        id: merge
        env:
          STALE: ${{ needs.gate.outputs.stale }}
          CALIB_FINGERPRINTS: /tmp/data/fingerprints.json:/tmp/plan/fingerprints.json
        run: |
          [ -f /tmp/plan/fingerprints.json ] && python3 calib/fingerprint.py merge /tmp/plan/fingerprints.json /tmp/data/fingerprints.json
          python3 calib/batch.py merge --data /tmp/data --plan /tmp/plan --built /tmp/built --daily "$DAILY_REQUESTS" --keep-months "${STALE:-[]}" \
            2>> "/tmp/data/logs/stderr-$GITHUB_RUN_ID-merge.log" || { echo "::error::merge failed (details in the encrypted log)"; exit 1; }
      - name: Report
        run: |
          python3 calib/run.py report --data /tmp/data --out /tmp/data/report 2>> "/tmp/data/logs/stderr-$GITHUB_RUN_ID-merge.log" \
            || echo "::warning::report failed (details in the encrypted log)"
      - name: Pack
        run: |
          mkdir -p /tmp/out
          python3 calib/state.py pack /tmp/data /tmp/out/calib-data.enc
          ls -la /tmp/out
      - uses: actions/upload-artifact@v7
        with:
          name: calib-data
          path: /tmp/out/calib-data.enc
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Next run
        if: steps.merge.outputs.more == 'yes' && needs.plan.outputs.chain == 'on'
        env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.workflow_ref }}
          DAYS: ${{ needs.plan.outputs.days }}
          NEW: ${{ needs.plan.outputs.new }}
        run: |
          self="${SELF#*/.github/workflows/}"; self="${self%%@*}"
          ids="$(for s in pending queued waiting requested; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$s&per_page=50" \
              --jq ".workflow_runs[] | select(.path == \".github/workflows/$self\" or .path == \".github/workflows/train.yml\") | .id"
          done | sort -u)"
          n=0
          for id in $ids; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            st="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .status)"
            case "$st" in
              pending|queued|waiting|requested) echo "waiting: run $id ($st)"; n=$((n + 1)) ;;
            esac
          done
          if [ "$n" -gt 0 ]; then echo "a run is waiting already: it goes next"; exit 0; fi
          gh workflow run "$self" -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f days="$DAYS" -f new_days="$NEW" -f chain=on
          echo "next run asked for"
  grids:
    needs: [plan, build, merge]
    if: ${{ !cancelled() && needs.merge.result == 'success' && needs.merge.outputs.months != '' && needs.merge.outputs.months != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        month: ${{ fromJSON(needs.merge.outputs.months) }}
    env:
      CALIB_DATA_KEY: ${{ secrets.CALIB_DATA_KEY }}
      MONTH: ${{ matrix.month }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: calib
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch the bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/grids
          set +e
          python3 calib/state.py fetch "calib-grids-$MONTH" /tmp/grids 2> /tmp/fetch.err
          rc=$?
          set -e
          if [ "$rc" = 3 ]; then echo "a new bundle"
          elif [ "$rc" != 0 ]; then tail -n 2 /tmp/fetch.err; echo "::error::couldn't fetch the bundle (exit $rc)"; exit 1; fi
          echo "$(ls /tmp/grids | wc -l) box-days in it"
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: calib-built-*
          path: /tmp/in/built
      - name: Add this run's boxes
        run: |
          n=0
          for f in /tmp/in/built/*/calib-built.enc; do
            [ -f "$f" ] || continue
            d="$(basename "$(dirname "$f")")"
            python3 calib/state.py unpack "$f" "/tmp/built/$d" || { echo "::warning::a shard's grids couldn't be read"; continue; }
            for day in "/tmp/built/$d/grids/$MONTH"-*; do
              [ -d "$day" ] || continue
              mkdir -p "/tmp/grids/$(basename "$day")"
              for box in "$day"/*; do
                [ -d "$box" ] || continue
                rm -rf "/tmp/grids/$(basename "$day")/$(basename "$box")"
                cp -r "$box" "/tmp/grids/$(basename "$day")/"
              done
              n=$((n + 1))
            done
          done
          rm -rf /tmp/built
          echo "$n box-days added; $(ls /tmp/grids | wc -l) in the bundle"
          [ "$(ls /tmp/grids | wc -l)" -gt 0 ] || { echo "::error::an empty bundle"; exit 1; }
      - name: Pack
        run: |
          mkdir -p /tmp/out
          python3 calib/state.py pack /tmp/grids "/tmp/out/calib-grids-$MONTH.enc"
          ls -la /tmp/out
      - uses: actions/upload-artifact@v7
        with:
          name: calib-grids-${{ matrix.month }}
          path: /tmp/out/calib-grids-${{ matrix.month }}.enc
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
  relay:
    needs: [gate, plan, merge]
    if: ${{ always() && !cancelled() && needs.gate.outputs.run == 'yes' && needs.plan.outputs.chain != 'off' && inputs.after_failure != 'yes' && (needs.plan.result == 'failure' || needs.merge.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Next run, once
        env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.workflow_ref }}
          DAYS: ${{ needs.plan.outputs.days }}
          NEW: ${{ needs.plan.outputs.new }}
        run: |
          sleep 900
          self="${SELF#*/.github/workflows/}"; self="${self%%@*}"
          ids="$(for s in pending queued waiting requested; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$s&per_page=50" \
              --jq ".workflow_runs[] | select(.path == \".github/workflows/$self\" or .path == \".github/workflows/train.yml\") | .id"
          done | sort -u)"
          n=0
          for id in $ids; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            st="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .status)"
            case "$st" in
              pending|queued|waiting|requested) echo "waiting: run $id ($st)"; n=$((n + 1)) ;;
            esac
          done
          if [ "$n" -gt 0 ]; then echo "a run is waiting already: it goes next"; exit 0; fi
          gh workflow run "$self" -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f days="${DAYS:-$DAYS_PER_RUN}" -f new_days="${NEW:-on}" -f chain=on -f after_failure=yes
          echo "next run asked for, after this one's failure"
