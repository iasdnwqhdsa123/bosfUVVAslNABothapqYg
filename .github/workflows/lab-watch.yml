name: Lab watch
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: lab-watch
  cancel-in-progress: true
jobs:
  watch:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Anything going?
        id: busy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=0
          for s in in_progress queued pending waiting requested; do
            k="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$s&per_page=50" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/lab-build.yml" or .path == ".github/workflows/lab-fingerprint.yml")] | length')"
            n=$((n + ${k:-0}))
          done
          echo "busy=$([ "$n" -gt 0 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "lab runs going or waiting: $n"
      - uses: actions/setup-python@v7
        if: steps.busy.outputs.busy == 'no'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: calib/requirements.txt
      - if: steps.busy.outputs.busy == 'no'
        run: for i in 1 2 3; do pip install -q -r calib/requirements.txt -r pipeline/requirements.txt && break; [ "$i" = 3 ] && exit 1; sleep 30; done
      - name: The sweep to resume
        id: r
        if: steps.busy.outputs.busy == 'no'
        env:
          CALIB_DATA_KEY: ${{ secrets.CALIB_DATA_KEY }}
          LAKE_S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          LAKE_S3_BUCKET: ${{ secrets.LAKE_S3_BUCKET || 'lake' }}
          LAKE_S3_KEY: ${{ secrets.LAKE_S3_KEY }}
          LAKE_S3_SECRET: ${{ secrets.LAKE_S3_SECRET }}
        run: python3 calib/labjobs.py resolve --what watch
      - name: Dispatch
        if: steps.busy.outputs.busy == 'no' && steps.r.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          SWEEP: ${{ steps.r.outputs.sweep }}
          WAVE: ${{ steps.r.outputs.wave }}
        run: |
          [[ "$SWEEP" =~ ^[0-9]{8}T[0-9]{6}Z$ ]] && [[ "$WAVE" =~ ^[0-9]+$ ]] || { echo "::error::not a sweep and a wave"; exit 1; }
          for i in 1 2 3 4 5; do gh workflow run lab-build.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f sweep="$SWEEP" -f wave="$WAVE" && break; [ "$i" = 5 ] && exit 1; sleep $((30 << (i - 1))); done
          echo "the chain had stopped: wave $WAVE of sweep $SWEEP asked for"
