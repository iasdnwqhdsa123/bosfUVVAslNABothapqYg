name: Lab lines
on:
  schedule:
    - cron: "55 12 * * *"
  push:  # (calib/lab-lines.request: the private repo's Calibration lab; GitHub's schedule here never fired, 24 Nov 2026)
    branches: [main]
    paths: ["calib/lab-lines.request"]
  workflow_dispatch:
    inputs:
      fit:
        description: "the monthly fit: as due, again, or none"
        type: choice
        options: [as due, again, none]
        default: as due
permissions:
  contents: read
concurrency:
  group: lab-lines
  cancel-in-progress: false
jobs:
  pairs:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LAKE_S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      LAKE_S3_BUCKET: ${{ secrets.LAKE_S3_BUCKET || 'lake' }}
      LAKE_S3_KEY: ${{ secrets.LAKE_S3_KEY }}
      LAKE_S3_SECRET: ${{ secrets.LAKE_S3_SECRET }}
      CALIB_DATA_KEY: ${{ secrets.CALIB_DATA_KEY }}
    steps:
      - name: Set up?
        id: on
        run: |
          if [ -n "$LAKE_S3_ENDPOINT" ] && [ -n "$LAKE_S3_BUCKET" ] && [ -n "$LAKE_S3_KEY" ] && [ -n "$LAKE_S3_SECRET" ] && [ -n "$CALIB_DATA_KEY" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "lab lines: the lake's secrets (LAKE_S3_*, CALIB_DATA_KEY) are not set: nothing done"; fi
      - uses: actions/checkout@v7
        if: steps.on.outputs.go == 'true'
      - uses: actions/setup-python@v7
        if: steps.on.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            calib/requirements.txt
            pipeline/requirements.txt
      - name: Python packages
        if: steps.on.outputs.go == 'true'
        run: for i in 1 2 3; do pip install -q -r calib/requirements.txt -r pipeline/requirements.txt && break; [ "$i" = 3 ] && exit 1; sleep 30; done
      - name: Pairs
        if: steps.on.outputs.go == 'true'
        run: python3 calib/convpairs.py --minutes 55
  air:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LAKE_S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      LAKE_S3_BUCKET: ${{ secrets.LAKE_S3_BUCKET || 'lake' }}
      LAKE_S3_KEY: ${{ secrets.LAKE_S3_KEY }}
      LAKE_S3_SECRET: ${{ secrets.LAKE_S3_SECRET }}
      CALIB_DATA_KEY: ${{ secrets.CALIB_DATA_KEY }}
    steps:
      - name: Set up?
        id: on
        run: |
          if [ -n "$LAKE_S3_ENDPOINT" ] && [ -n "$LAKE_S3_BUCKET" ] && [ -n "$LAKE_S3_KEY" ] && [ -n "$LAKE_S3_SECRET" ] && [ -n "$CALIB_DATA_KEY" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "lab lines: the lake's secrets (LAKE_S3_*, CALIB_DATA_KEY) are not set: no air pairs"; fi
      - uses: actions/checkout@v7
        if: steps.on.outputs.go == 'true'
      - uses: actions/setup-python@v7
        if: steps.on.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            calib/requirements.txt
            pipeline/requirements.txt
      - uses: actions/setup-node@v5
        if: steps.on.outputs.go == 'true'
        with:
          node-version: "22"
      - name: Python packages
        if: steps.on.outputs.go == 'true'
        run: for i in 1 2 3; do pip install -q -r calib/requirements.txt -r pipeline/requirements.txt && break; [ "$i" = 3 ] && exit 1; sleep 30; done
      - name: Air pairs
        if: steps.on.outputs.go == 'true'
        run: python3 calib/airpairs.py --minutes 55
  fit:
    needs: [pairs, air]
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.fit != 'none') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LAKE_S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      LAKE_S3_BUCKET: ${{ secrets.LAKE_S3_BUCKET || 'lake' }}
      LAKE_S3_KEY: ${{ secrets.LAKE_S3_KEY }}
      LAKE_S3_SECRET: ${{ secrets.LAKE_S3_SECRET }}
      CALIB_DATA_KEY: ${{ secrets.CALIB_DATA_KEY }}
      AGAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.fit == 'again' && 'yes' || '' }}
    steps:
      - name: Set up?
        id: on
        run: |
          if [ -n "$LAKE_S3_ENDPOINT" ] && [ -n "$LAKE_S3_BUCKET" ] && [ -n "$LAKE_S3_KEY" ] && [ -n "$LAKE_S3_SECRET" ] && [ -n "$CALIB_DATA_KEY" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "lab lines: the lake's secrets are not set: no fit"; fi
      - uses: actions/checkout@v7
        if: steps.on.outputs.go == 'true'
      - uses: actions/setup-python@v7
        if: steps.on.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            calib/requirements.txt
            pipeline/requirements.txt
      - name: Python packages
        if: steps.on.outputs.go == 'true'
        run: for i in 1 2 3; do pip install -q -r calib/requirements.txt -r pipeline/requirements.txt && break; [ "$i" = 3 ] && exit 1; sleep 30; done
      - name: Fit
        if: steps.on.outputs.go == 'true'
        run: |
          set -- run
          [ "$AGAIN" = "yes" ] && set -- "$@" --again
          python3 calib/convfit.py "$@"
      - name: The air-motion head's fit
        if: ${{ !cancelled() && steps.on.outputs.go == 'true' }}
        run: |
          set -- run
          [ "$AGAIN" = "yes" ] && set -- "$@" --again
          python3 calib/airfit.py "$@"
      - name: The sink between thermals' fit
        if: ${{ !cancelled() && steps.on.outputs.go == 'true' }}
        run: |
          set -- run
          [ "$AGAIN" = "yes" ] && set -- "$@" --again
          python3 calib/sinkfit.py "$@"
