name: Lab satellite backfill
on:
  push:
    branches: [main]
    paths: ["calib/lab-satfill.request"]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: lab-satfill
  cancel-in-progress: false
jobs:
  satfill:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    env:
      COLLECTOR_TRAIN: ${{ vars.COLLECTOR_TRAIN || '1' }}
      LAKE_S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      LAKE_S3_BUCKET: ${{ secrets.LAKE_S3_BUCKET || 'lake' }}
      LAKE_S3_KEY: ${{ secrets.LAKE_S3_KEY }}
      LAKE_S3_SECRET: ${{ secrets.LAKE_S3_SECRET }}
      CALIB_DATA_KEY: ${{ secrets.CALIB_DATA_KEY }}
      OPS_S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      OPS_S3_BUCKET: ${{ secrets.OPS_S3_BUCKET || 'ops' }}
      OPS_RO_KEY: ${{ secrets.OPS_RO_KEY }}
      OPS_RO_SECRET: ${{ secrets.OPS_RO_SECRET }}
    steps:
      - name: Set up?
        id: on
        run: |
          if [ -n "$LAKE_S3_ENDPOINT" ] && [ -n "$LAKE_S3_BUCKET" ] && [ -n "$LAKE_S3_KEY" ] && [ -n "$LAKE_S3_SECRET" ] && [ -n "$CALIB_DATA_KEY" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "lab satellite backfill: the lake's secrets (LAKE_S3_*, CALIB_DATA_KEY) are not set: nothing done"; fi
      - uses: actions/checkout@v7
        if: steps.on.outputs.go == 'true'
      - uses: actions/setup-python@v7
        if: steps.on.outputs.go == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            calib/requirements.txt
            calib/requirements-pairs.txt
            pipeline/requirements.txt
      - name: Python packages
        if: steps.on.outputs.go == 'true'
        run: for i in 1 2 3; do pip install -q -r calib/requirements.txt -r calib/requirements-pairs.txt -r pipeline/requirements.txt && break; [ "$i" = 3 ] && exit 1; sleep 30; done
      - name: The satellite
        if: steps.on.outputs.go == 'true'
        run: python3 calib/pairjob.py run --days hindcast --kinds sat,vis --sat-all --minutes 330 --status "$RUNNER_TEMP/satfill.json"
      - name: The next run
        if: steps.on.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(jq -r '.more' "$RUNNER_TEMP/satfill.json" 2>/dev/null)" = true ]; then
            for i in 1 2 3 4 5; do gh workflow run lab-satfill.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" && break; [ "$i" = 5 ] && exit 1; sleep $((30 << (i - 1))); done
            echo "days left: the next run asked for"
          else
            echo "the backfill's days have their satellite"
          fi
